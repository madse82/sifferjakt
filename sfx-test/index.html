<!DOCTYPE html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sifferjakt – ljudtest 2</title><style>
body{font-family:-apple-system,system-ui,sans-serif;background:#f6f4ee;color:#222;margin:0 auto;padding:16px 14px 60px;max-width:680px}
h1{font-size:20px;margin:4px 0}p{color:#555;font-size:14px;margin:6px 0 14px}
.pack{background:#fff;border-radius:14px;box-shadow:0 1px 3px #0002;padding:12px;margin:12px 0}
.pack h2{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;border:0;border-radius:9px;padding:8px 10px;background:#eceae3}
button.demo{background:#6aaa64;color:#fff;font-weight:600}
button.lose{background:#787c7e;color:#fff;font-weight:600}
button.on{outline:2px solid #c9b458}
</style></head><body>
<h1>Ljudtest 2 – 12 ljudstilar</h1>
<p>Börja med <b>▶ Demo</b>: en gissning (grön, gul, grå, grön, grön) och sedan vinst. <b>▶ Förlust</b> visar en förlust. Gröna rutor stiger i tonhöjd som i spelet. Säg vilken stil du gillar, eller blanda, t.ex. "vinst från glass".</p>
<div id="packs"></div>
<script>
const packs=[["soft","Mjuk"],["dreamy","Drömsk"],["zen","Zen"],["glass","Glas"],["organic","Trä/organisk"],["rubber","Gummi"],["arcade","Arcade"],["minimal","Minimal"],["studio","Studio"],["mechanical","Mekanisk"],["cinematic","Filmisk"],["scifi","Sci-fi"]];
const slots=[["check","Grön"],["select","Gul"],["release","Grå"],["invalid-drop","Ogiltig"],["reaction","Det du vet"],["achievement","Vinst"],["level-up","Vinst 2"],["streak","Vinst 3"],["error","Förlust"]];
const pool=[...Array(6)].map(()=>new Audio());let pi=0;
function play(p,n,rate=1){const a=pool[pi++%pool.length];a.src='p/'+p+'/'+n+'.mp3';a.preservesPitch=false;a.webkitPreservesPitch=false;a.playbackRate=rate;a.currentTime=0;a.play().catch(()=>{});}
let timers=[];function stop(){timers.forEach(clearTimeout);timers=[];}
function seq(p,steps){stop();let t=0;for(const [d,n,r] of steps){t+=d;timers.push(setTimeout(()=>play(p,n,r),t));}}
const R=i=>Math.pow(2,i*2/12);
const P=document.getElementById('packs');
for(const [p,label] of packs){
  const d=document.createElement('div');d.className='pack';
  const h=document.createElement('h2');h.textContent=label;d.append(h);
  const r=document.createElement('div');r.className='row';
  const demo=document.createElement('button');demo.className='demo';demo.textContent='▶ Demo';
  demo.onclick=()=>seq(p,[[0,'check',R(0)],[320,'select',1],[320,'release',1],[320,'check',R(3)],[320,'check',R(4)],[450,'reaction',1],[650,'achievement',1]]);
  const lose=document.createElement('button');lose.className='lose';lose.textContent='▶ Förlust';
  lose.onclick=()=>seq(p,[[0,'invalid-drop',1],[700,'release',1],[320,'select',1],[320,'release',1],[320,'check',R(3)],[320,'release',1],[600,'error',1]]);
  r.append(demo,lose);
  for(const [n,t] of slots){const b=document.createElement('button');b.textContent=t;b.onclick=()=>{stop();document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');play(p,n);};r.append(b);}
  d.append(r);P.append(d);
}
</script></body></html>
